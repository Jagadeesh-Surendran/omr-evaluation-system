<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Solver Frontend Integration Tests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-left: auto;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status.idle {
            background: #e9ecef;
            color: #495057;
        }

        .status.running {
            background: #fff3cd;
            color: #856404;
        }

        .status.passed {
            background: #d4edda;
            color: #155724;
        }

        .status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .content {
            padding: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 2px solid #dee2e6;
        }

        .summary-card.passed {
            border-color: #28a745;
            background: #d4edda;
        }

        .summary-card.failed {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .summary-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .summary-card p {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .test-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }

        .test-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .test-icon {
            font-size: 1.5rem;
            width: 30px;
            text-align: center;
        }

        .test-icon.pending {
            color: #6c757d;
        }

        .test-icon.running {
            color: #ffc107;
            animation: spin 1s linear infinite;
        }

        .test-icon.passed {
            color: #28a745;
        }

        .test-icon.failed {
            color: #dc3545;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .test-name {
            flex: 1;
            font-weight: 500;
        }

        .test-error {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #856404;
        }

        .console {
            margin-top: 30px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .console-line {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .console-line.error {
            color: #f48771;
        }

        .console-line.success {
            color: #89d185;
        }

        .console-line.info {
            color: #6cb6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 AI Solver Frontend Integration Tests</h1>
            <p>Comprehensive testing for the AI Question Solver interface</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="runTestsBtn" onclick="runAllTests()">
                ▶ Run All Tests
            </button>
            <button class="btn btn-secondary" id="clearBtn" onclick="clearResults()">
                🗑 Clear Results
            </button>
            <div class="status idle" id="statusBadge">Idle</div>
        </div>

        <div class="content">
            <div class="summary" id="summary">
                <div class="summary-card">
                    <h3 id="totalTests">0</h3>
                    <p>Total Tests</p>
                </div>
                <div class="summary-card passed">
                    <h3 id="passedTests">0</h3>
                    <p>Passed</p>
                </div>
                <div class="summary-card failed">
                    <h3 id="failedTests">0</h3>
                    <p>Failed</p>
                </div>
            </div>

            <div class="test-list" id="testList"></div>

            <div class="console" id="console"></div>
        </div>
    </div>

    <script src="test_ai_solver_integration.js"></script>
    <script>
        // Override console methods to capture output
        const consoleOutput = [];
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function(...args) {
            originalLog.apply(console, args);
            addConsoleLine(args.join(' '), 'info');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addConsoleLine(args.join(' '), 'error');
        };

        function addConsoleLine(text, type = 'info') {
            const consoleEl = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = text;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // Custom test runner with UI updates
        class UITestRunner extends TestRunner {
            constructor() {
                super();
                this.currentTestIndex = 0;
            }

            async run() {
                const statusBadge = document.getElementById('statusBadge');
                const runBtn = document.getElementById('runTestsBtn');
                
                statusBadge.textContent = 'Running...';
                statusBadge.className = 'status running';
                runBtn.disabled = true;

                // Initialize test list
                const testList = document.getElementById('testList');
                testList.innerHTML = '';
                
                this.tests.forEach((test, index) => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item';
                    testItem.id = `test-${index}`;
                    testItem.innerHTML = `
                        <div class="test-icon pending" id="icon-${index}">⏳</div>
                        <div class="test-name">${test.name}</div>
                    `;
                    testList.appendChild(testItem);
                });

                // Update summary
                document.getElementById('totalTests').textContent = this.tests.length;

                // Run tests
                for (let i = 0; i < this.tests.length; i++) {
                    const test = this.tests[i];
                    const testItem = document.getElementById(`test-${i}`);
                    const icon = document.getElementById(`icon-${i}`);

                    // Mark as running
                    icon.textContent = '⏳';
                    icon.className = 'test-icon running';

                    try {
                        await test.fn();
                        this.results.push({ name: test.name, status: 'PASS' });
                        
                        // Mark as passed
                        icon.textContent = '✓';
                        icon.className = 'test-icon passed';
                        
                        console.log(`✓ ${test.name} PASSED`);
                    } catch (error) {
                        this.results.push({ name: test.name, status: 'FAIL', error: error.message });
                        
                        // Mark as failed
                        icon.textContent = '✗';
                        icon.className = 'test-icon failed';
                        
                        // Add error message
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'test-error';
                        errorDiv.textContent = error.message;
                        testItem.appendChild(errorDiv);
                        
                        console.error(`✗ ${test.name} FAILED: ${error.message}`);
                    }

                    // Update summary
                    const passed = this.results.filter(r => r.status === 'PASS').length;
                    const failed = this.results.filter(r => r.status === 'FAIL').length;
                    document.getElementById('passedTests').textContent = passed;
                    document.getElementById('failedTests').textContent = failed;
                }

                // Update final status
                const passed = this.results.filter(r => r.status === 'PASS').length;
                const failed = this.results.filter(r => r.status === 'FAIL').length;
                
                if (failed === 0) {
                    statusBadge.textContent = `All Tests Passed (${passed}/${this.tests.length})`;
                    statusBadge.className = 'status passed';
                } else {
                    statusBadge.textContent = `${failed} Test(s) Failed`;
                    statusBadge.className = 'status failed';
                }

                runBtn.disabled = false;
                this.printSummary();
            }
        }

        // Replace the runner with UI version
        const uiRunner = new UITestRunner();
        uiRunner.tests = runner.tests;

        async function runAllTests() {
            clearResults();
            await uiRunner.run();
        }

        function clearResults() {
            document.getElementById('console').innerHTML = '';
            document.getElementById('testList').innerHTML = '';
            document.getElementById('passedTests').textContent = '0';
            document.getElementById('failedTests').textContent = '0';
            document.getElementById('statusBadge').textContent = 'Idle';
            document.getElementById('statusBadge').className = 'status idle';
            uiRunner.results = [];
        }

        // Check backend availability on load
        window.addEventListener('load', async () => {
            addConsoleLine('Checking backend availability...', 'info');
            
            try {
                const response = await fetch('http://localhost:5000/api/health', {
                    signal: AbortSignal.timeout(3000)
                });
                
                if (response.ok) {
                    addConsoleLine('✓ Backend is online and ready', 'success');
                } else {
                    addConsoleLine('✗ Backend returned error status', 'error');
                }
            } catch (error) {
                addConsoleLine('✗ Backend is not available. Please start the backend server.', 'error');
                addConsoleLine('Run: python backend/app.py', 'info');
            }
        });
    </script>
</body>
</html>
